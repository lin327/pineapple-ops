apiVersion: v1
kind: Namespace
metadata:
  name: ghost
---
apiVersion: v1
kind: Secret
metadata:
  name: ghost-mysql-secret
  namespace: ghost
type: Opaque
# ! fixme: 部署前必须替换为真实强密码，当前为占位符
stringData:
  root-password: "CHANGE_ME_ROOT_PASSWORD"
  ghost-password: "CHANGE_ME_GHOST_PASSWORD"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: ghost
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ghost
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghost-mysql-secret
              key: root-password
        - name: MYSQL_DATABASE
          value: ghost
        - name: MYSQL_USER
          value: ghost
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghost-mysql-secret
              key: ghost-password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ghost
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-content
  namespace: ghost
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      containers:
      - name: ghost
        image: ghost:5-alpine
        env:
        - name: url
          value: "https://ghost.pineapple-user.site"
        - name: database__client
          value: mysql
        - name: database__connection__host
          value: mysql
        - name: database__connection__port
          value: "3306"
        - name: database__connection__user
          value: ghost
        - name: database__connection__password
          valueFrom:
            secretKeyRef:
              name: ghost-mysql-secret
              key: ghost-password
        - name: database__connection__database
          value: ghost
        - name: server__trust
          value: "true"
        - name: server__trust_proxy
          value: "true"
        - name: mail__transport
          value: "SMTP"
        - name: mail__options__host
          value: "100.115.0.2"
        - name: mail__options__port
          value: "25"
        - name: mail__options__secure
          value: "false"
        - name: mail__from
          value: "ghost@tentative.me"
        ports:
        - containerPort: 2368
        volumeMounts:
        - name: content
          mountPath: /var/lib/ghost/content
      volumes:
      - name: content
        persistentVolumeClaim:
          claimName: ghost-content
---
apiVersion: v1
kind: Service
metadata:
  name: ghost
  namespace: ghost
spec:
  type: NodePort
  selector:
    app: ghost
  ports:
  - port: 80
    targetPort: 2368
    nodePort: 30080
