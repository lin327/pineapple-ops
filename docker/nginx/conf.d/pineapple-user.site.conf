# 腾讯云 Nginx 统一入口网关配置
# 文件路径: /etc/nginx/conf.d/pineapple-user.site.conf

# ──────────────────────────────────────────────
#  HTTP → HTTPS 强制跳转
# ──────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name *.pineapple-user.site pineapple-user.site;
    return 301 https://$host$request_uri;
}

# ──────────────────────────────────────────────
#  Ghost 后台 HTTP 拒绝（防止绕过 HTTPS）
# ──────────────────────────────────────────────
server {
    listen 80;
    server_name ghost.pineapple-user.site;
    return 444;
}

# ──────────────────────────────────────────────
#  主站 pineapple-user.site → 已迁移到 Vercel
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name pineapple-user.site www.pineapple-user.site;
    include snippets/ssl-params.conf;
}

# ──────────────────────────────────────────────
#  K3s 通配子域名（默认入口）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name *.pineapple-user.site;
    include snippets/ssl-params.conf;

    # WebSocket 支持（Traefik Dashboard 等需要）
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://100.115.0.33:31717;
    }
}

# ──────────────────────────────────────────────
#  Vaultwarden（京东云 Docker）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name pass.pineapple-user.site;
    include snippets/ssl-params.conf;

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://100.115.0.2:8080;
    }
}

# ──────────────────────────────────────────────
#  AList 115网盘（新加坡 Master Docker）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name drive.pineapple-user.site;
    include snippets/ssl-params.conf;

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://100.115.0.33:31717;
    }
}

# ──────────────────────────────────────────────
#  Uptime Kuma（京东云 Docker）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name status.pineapple-user.site;
    include snippets/ssl-params.conf;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://100.115.0.2:3001;
    }
}

# ──────────────────────────────────────────────
#  MinIO 控制台（新加坡 Master K3s）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name minio.pineapple-user.site;
    include snippets/ssl-params.conf;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    client_max_body_size 0;

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://100.115.0.33:31901;
    }
}

# ──────────────────────────────────────────────
#  Kuboard v4（新加坡 Master K3s）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name kuboard.pineapple-user.site;
    include snippets/ssl-params.conf;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://100.115.0.33:31717;
    }
}

# ──────────────────────────────────────────────
#  Ghost 后台（新加坡 Master K3s）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ghost.pineapple-user.site;
    include snippets/ssl-params.conf;

    client_max_body_size 50m;

    location / {
        include snippets/proxy-params.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://100.115.0.33:30080;
    }
}

# ──────────────────────────────────────────────
#  Grafana 监控面板（新加坡 Master K3s）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name grafana.pineapple-user.site;
    include snippets/ssl-params.conf;

    # WebSocket 支持（Grafana Live 需要）
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://100.115.0.33:30858;
    }
}

# ──────────────────────────────────────────────
#  Kibana 日志面板（新加坡 Master K3s）
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name kibana.pineapple-user.site;
    include snippets/ssl-params.conf;

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://100.115.0.33:30561;
    }
}
